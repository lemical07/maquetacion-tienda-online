<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>Finalizar Compra | LíShop</title>
<link rel="icon" type="image/png" href="../img/favicon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,500;0,600;0,700;1,400&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../css/variables.css">
<link rel="stylesheet" href="../css/base.css">
<link rel="stylesheet" href="../css/layout.css">
<link rel="stylesheet" href="../css/component.css">
<link rel="stylesheet" href="../css/page-components.css">
<link rel="stylesheet" href="../css/pages.css">
</head>
<body>
<header class="header">
  <a class="header__marca" href="principal.html">
    <img src="../img/logotipo.png" alt="Logotipo de LíShop">
    <span>Lí<strong>Shop</strong></span>
  </a>
  <nav class="header__nav" aria-label="Navegación principal">
      <a href="../index.html">Inicio</a>
      <a href="catalogo.html">Catálogo</a>
      <a href="carrito.html">Carrito</a>
      <a href="perfil.html">Perfil</a>
  </nav>
  <div class="header__acciones">
    <a class="header__icono" href="carrito.html"><img src="../img/carrito.png" alt=""><span>Carrito</span></a>
    <a class="header__icono" href="perfil.html"><img src="../img/perfil.png" alt=""><span>Perfil</span></a>
  </div>
</header>
<main class="contenedor">
  <h1 class="titulo-seccion">Finalizar Compra</h1>
  <form class="checkout" action="historial.html" method="get">
    <div class="checkout__formulario">
      <fieldset class="panel">
        <legend>1. Información de Entrega</legend>
        <label class="campo">Nombre completo
          <input type="text" name="nombre" placeholder="Nombre y apellido" required>
        </label>
        <label class="campo">Edificio / Facultad
          <input type="text" name="edificio" placeholder="Ej. Edificio B, Facultad de Derecho" required>
        </label>
      </fieldset>
      <fieldset class="panel metodos">
        <legend>2. Método de Pago</legend>
        <label class="opcion"><input type="radio" name="pago" id="pago-tarjeta" value="tarjeta" checked> Tarjeta de crédito o débito</label>
        <label class="opcion"><input type="radio" name="pago" id="pago-entrega" value="entrega"> Pago contra entrega</label>
        <label class="campo campo-tarjeta">Número de tarjeta
          <input type="text" name="tarjeta" inputmode="numeric" maxlength="19" placeholder="0000 0000 0000 0000">
        </label>
      </fieldset>
    </div>
    <aside class="panel resumen">
      <h2>Resumen del pedido</h2>
      <ul class="resumen__items">
        <li><img src="../img/of-chesterfield.png" alt="Chesterfield"><span>Chesterfield <small>x1</small></span><strong>2,450 GTQ</strong></li>
        <li><img src="../img/of-trench-coat.png" alt="Trench Coat"><span>Trench Coat <small>x1</small></span><strong>3,360 GTQ</strong></li>
        <li><img src="../img/of-corbata-seda.png" alt="Corbata de Seda Italiana"><span>Corbata de Seda Italiana <small>x2</small></span><strong>1,680 GTQ</strong></li>
        <li><img src="../img/ac-cartera-cuero.png" alt="Cartera de Cuero"><span>Cartera de Cuero <small>x1</small></span><strong>1,300 GTQ</strong></li>
      </ul>
      <p class="resumen__linea"><span>Envío</span><span>Gratis</span></p>
      <p class="resumen__linea resumen__total"><span>Total</span><span>8,790 GTQ</span></p>
      <button class="btn btn--primario btn--bloque" type="submit">Confirmar y Pagar</button>
    </aside>
  </form>
</main>
</body>
</html>
