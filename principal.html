<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LíShop</title>
    <link rel="stylesheet" href="./css/component.css">
    <link rel="icon" type="image/png" href="./img/favicon.png">
</head>
<body>
    <div class="principal">
        <header class="main-header">
            <div class="logo_pr">
                <img src="./img/logotipo.png" alt="LíShop" class="logo-img">
                <span class="logo-text">Lí<strong>Shop</strong></span>
            </div>
            <nav class="navbar">
                <ul class="nav-links">
                    <li><a href="index.html">Inicio</a></li>
                    <li><a href="catalogo.html">Catálogo</a></li>
                    <li><a href="carrito.html">Carrito</a></li>
                    <li><a href="perfil.html">Perfil</a></li>
                </ul>
            </nav>
            <div class="header-icons">
                <a href="carrito.html" class="icon-link">
                    <img src="./img/carrito.png" alt="Carrito" class="icon-img">
                    <span>Carrito</span>
                </a>
                <a href="perfil.html" class="icon-link">
                    <img src="./img/perfil.png" alt="Perfil" class="icon-img">
                    <span>Perfil</span>
                </a>
            </div>
        </header>
        <section class="categories">
            <h2 class="section-title">Categorías</h2>
            <div class="category-list">
                <div class="categ">
                    <img src="./img/abrigo.png" alt="abrigos" class="abr">
                    <a href="catalogo.html" class="category-item">Abrigos</a>
                </div>
                <div class="categ">
                    <img src="./img/camisa.png" alt="camisa" class="abr">
                    <a href="catalogo.html" class="category-item">Camisas</a>
                </div>
                <div class="categ">
                    <img src="./img/pantalon.png" alt="pantalon" class="abr">
                    <a href="catalogo.html" class="category-item">Pantalones</a>
                </div>
                <div class="categ">
                    <img src="./img/accesorio.png" alt="accesorio" class="abr">
                    <a href="catalogo.html" class="category-item">Accesorios</a>
                </div>
            </div>
        </section>
    </div>
</body>
</html>
